<div class="sticky top-0 z-10 bg-background-primary px-4 md:px-6 py-3 border-b-[0.5px] border-border-tertiary flex items-center">
  <div class="text-[16px] font-medium text-text-primary">Data &amp; storage</div>
</div>
<div class="px-4 md:px-6 py-4">
<div class="text-[13px] text-text-secondary mb-5">Export your data and manage storage usage.</div>

@if (toast()) {
  <div class="mb-4 px-3 py-2 rounded-md bg-[#EEFAF4] border-[0.5px] border-[#6FCF97] text-[12px] text-[#1A6B3C]">{{ toast() }}</div>
}

<div class="border-[0.5px] border-border-tertiary rounded-lg overflow-hidden mb-4">
  <div class="text-[11px] font-medium text-text-secondary px-[14px] py-2 bg-background-secondary border-b-[0.5px] border-border-tertiary uppercase tracking-[0.06em]">Your data</div>
  <div class="flex items-center justify-between px-[14px] py-[13px] border-b-[0.5px] border-border-tertiary gap-4">
    <div><div class="text-[13px] font-medium text-text-primary">Download your data</div><div class="text-[12px] text-text-secondary mt-0.5">Export posts, follows, and activity</div></div>
    <button type="button" (click)="requestExport('Data')" class="border-[0.5px] border-border-secondary text-text-primary rounded-md px-[14px] py-1.5 text-[12px] cursor-pointer bg-transparent hover:bg-background-secondary transition-colors shrink-0">Request export</button>
  </div>
  <div class="flex items-center justify-between px-[14px] py-[13px] gap-4">
    <div><div class="text-[13px] font-medium text-text-primary">Download media</div><div class="text-[12px] text-text-secondary mt-0.5">All photos and videos you've posted</div></div>
    <button type="button" (click)="requestExport('Media')" class="border-[0.5px] border-border-secondary text-text-primary rounded-md px-[14px] py-1.5 text-[12px] cursor-pointer bg-transparent hover:bg-background-secondary transition-colors shrink-0">Request export</button>
  </div>
</div>

<div class="border-[0.5px] border-border-tertiary rounded-lg overflow-hidden mb-4">
  <div class="text-[11px] font-medium text-text-secondary px-[14px] py-2 bg-background-secondary border-b-[0.5px] border-border-tertiary uppercase tracking-[0.06em]">Cache &amp; storage</div>
  <div class="flex items-center justify-between px-[14px] py-[13px] border-b-[0.5px] border-border-tertiary gap-4">
    <div><div class="text-[13px] font-medium text-text-primary">Cached data</div><div class="text-[12px] text-text-secondary mt-0.5">Device and browser cache</div></div>
    <button type="button" (click)="clearCache()" class="border-[0.5px] border-[#f5c6cb] text-[#842029] rounded-md px-[14px] py-1.5 text-[12px] cursor-pointer bg-transparent hover:bg-[#fff5f5] transition-colors shrink-0">Clear cache</button>
  </div>
  <div class="flex items-center justify-between px-[14px] py-[13px] gap-4">
    <div><div class="text-[13px] font-medium text-text-primary">Media quality</div><div class="text-[12px] text-text-secondary mt-0.5">Affects upload resolution</div></div>
    <div class="flex items-center gap-2">
      <select class="bg-background-secondary border-[0.5px] border-border-secondary rounded-md px-2.5 py-[5px] text-[12px] text-text-primary font-[inherit] focus:outline-none" [ngModel]="mediaQuality()" (ngModelChange)="mediaQuality.set($event)">
        <option>High (original)</option><option>Medium (compressed)</option><option>Low (data saver)</option>
      </select>
      <button
          type="button"
          (click)="saveQuality()"
          [disabled]="savedQuality()"
          [class]="'w-[54px] justify-center rounded-md py-[5px] text-[12px] font-medium flex items-center gap-1 border-[0.5px] transition-all duration-300 ' +
            (savedQuality()
              ? 'bg-[#16a34a] border-[#16a34a] text-white scale-105 shadow-[0_0_0_2px_rgba(22,163,74,0.2)] cursor-default'
              : 'border-border-secondary text-text-primary bg-transparent cursor-pointer hover:bg-background-secondary active:scale-95')">
          @if (savedQuality()) {
            <svg class="w-3 h-3 shrink-0 [stroke-dasharray:20] [stroke-dashoffset:20] animate-draw-check" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2 7L5.5 10.5L12 3.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          } @else {
            <span>Save</span>
          }
        </button>
    </div>
  </div>
</div>
</div>
