<div class="hidden lg:flex flex-col gap-[2px] sticky top-[78px]">
  <a routerLink="/" [routerLinkActiveOptions]="{exact: true}" routerLinkActive="nav-active"
     class="nav-link flex items-center gap-3 px-4 py-[10px] rounded-[12px] text-[14px] font-medium text-text-secondary transition-all no-underline">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/>
      <path d="M9 21V12h6v9"/>
    </svg>
    Home
  </a>
  <a routerLink="/explore" routerLinkActive="nav-active"
     class="nav-link flex items-center gap-3 px-4 py-[10px] rounded-[12px] text-[14px] font-medium text-text-secondary transition-all no-underline">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>
    </svg>
    Explore
  </a>
  <a routerLink="/notifications" routerLinkActive="nav-active"
     class="nav-link relative flex items-center gap-3 px-4 py-[10px] rounded-[12px] text-[14px] font-medium text-text-secondary transition-all no-underline">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 01-3.46 0"/>
    </svg>
    Notifications
    @if (notifService.unreadCount() > 0) {
      <span class="ml-auto min-w-[20px] h-[20px] bg-[#e74c3c] text-white text-[10px] font-medium rounded-full flex items-center justify-center px-[4px]">
        {{ notifService.unreadCount() > 99 ? '99+' : notifService.unreadCount() }}
      </span>
    }
  </a>
  <a routerLink="/messages" routerLinkActive="nav-active"
     class="nav-link relative flex items-center gap-3 px-4 py-[10px] rounded-[12px] text-[14px] font-medium text-text-secondary transition-all no-underline">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
    </svg>
    Messages
    @if (msgService.unreadCount() > 0) {
      <span class="ml-auto min-w-[20px] h-[20px] bg-[#e74c3c] text-white text-[10px] font-medium rounded-full flex items-center justify-center px-[4px]">
        {{ msgService.unreadCount() > 99 ? '99+' : msgService.unreadCount() }}
      </span>
    }
  </a>
  <a routerLink="/societies" routerLinkActive="nav-active"
     class="nav-link flex items-center gap-3 px-4 py-[10px] rounded-[12px] text-[14px] font-medium text-text-secondary transition-all no-underline">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
      <circle cx="9" cy="7" r="4"/>
      <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>
    </svg>
    Societies
  </a>
  <a [routerLink]="['/users', auth.user()?.username]" routerLinkActive="nav-active"
     class="nav-link flex items-center gap-3 px-4 py-[10px] rounded-[12px] text-[14px] font-medium text-text-secondary transition-all no-underline">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
    </svg>
    Profile
  </a>
  <a routerLink="/settings" routerLinkActive="nav-active"
     class="nav-link flex items-center gap-3 px-4 py-[10px] rounded-[12px] text-[14px] font-medium text-text-secondary transition-all no-underline">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
    </svg>
    Settings
  </a>
</div>
