<nav class="h-[62px] bg-white border-b border-[rgba(83,74,183,0.12)] flex items-center px-4 sm:px-6 gap-2 sticky top-0 z-[200] animate-slideDown">

  <!-- Logo -->
  <a routerLink="/" class="flex items-center gap-[9px] no-underline shrink-0 mr-4 group">
    <div class="w-[34px] h-[34px] bg-[#534AB7] rounded-[10px] flex items-center justify-center transition-transform duration-[220ms] group-hover:-rotate-[8deg] group-hover:scale-[1.07] shrink-0">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="white">
        <path d="M10 2C5.58 2 2 5.13 2 9c0 2.1 1 3.97 2.6 5.3L4 17l3.1-1.4C7.97 15.86 8.97 16 10 16c4.42 0 8-3.13 8-7S14.42 2 10 2z"/>
      </svg>
    </div>
    <span class="font-['Playfair_Display'] text-[20px] text-[#18162e] tracking-[-0.2px] leading-none hidden sm:inline">samv<em class="not-italic text-[#534AB7]">aa</em>d</span>
  </a>

  <!-- Search (hidden on xs) -->
  <div class="flex-1 max-w-[360px] relative mr-1 hidden sm:block">
    <span class="absolute left-[11px] top-1/2 -translate-y-1/2 pointer-events-none flex">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a09db8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>
      </svg>
    </span>
    <input class="w-full h-[36px] bg-[#F7F7FB] border border-[rgba(83,74,183,0.12)] rounded-[20px] pl-8 pr-[14px] text-[13.5px] text-[#18162e] outline-none transition-all focus:border-[#534AB7] focus:bg-white placeholder:text-[#a09db8]"
           type="text" placeholder="Search people, posts, topics…">
  </div>

  <!-- Right Controls -->
  <div class="flex items-center gap-2 ml-auto">

    <!-- Post Button -->
    <button class="flex items-center gap-[7px] h-[36px] px-[14px] sm:px-[18px] bg-[#534AB7] text-white border-none rounded-[20px] text-[13.5px] font-medium cursor-pointer transition-all hover:bg-[#3C3489] active:scale-[0.97] shrink-0 whitespace-nowrap">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.3" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      <span class="hidden sm:block">Post</span>
    </button>

    <!-- Avatar + Dropdown -->
    <div class="relative cursor-pointer ml-1" (click)="$event.stopPropagation(); dropdownOpen.update(v => !v)">
      <div class="w-[36px] h-[36px] rounded-full bg-[#534AB7] text-white text-[12.5px] font-medium flex items-center justify-center border-2 border-transparent transition-all hover:border-[#534AB7] hover:scale-[1.06] select-none shrink-0">AS</div>
      <div class="absolute bottom-[1px] right-[1px] w-[9px] h-[9px] bg-[#22c55e] rounded-full border-[1.5px] border-white pointer-events-none"></div>

      @if (dropdownOpen()) {
        <div class="absolute top-[calc(100%+10px)] right-0 w-[218px] bg-white border border-[rgba(83,74,183,0.24)] rounded-[14px] overflow-hidden z-[400] animate-dropIn shadow-md">
          <div class="px-[15px] py-[13px] pb-[10px] border-b border-[rgba(83,74,183,0.12)]">
            <div class="text-[13.5px] font-medium text-[#18162e]">Aryan Sharma</div>
            <div class="text-[12px] text-[#a09db8] mt-[2px]">@aryan.dev · Patna, India</div>
          </div>
          <a routerLink="/profile" (click)="dropdownOpen.set(false)" class="flex items-center gap-[10px] px-[15px] py-[10px] text-[13px] text-[#6b6880] hover:bg-[#F7F7FB] hover:text-[#534AB7] transition-all no-underline cursor-pointer">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
            View profile
          </a>
          <a routerLink="/notifications" (click)="dropdownOpen.set(false)" class="flex items-center gap-[10px] px-[15px] py-[10px] text-[13px] text-[#6b6880] hover:bg-[#F7F7FB] hover:text-[#534AB7] transition-all no-underline cursor-pointer">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
            Notifications
          </a>
          <a routerLink="/messages" (click)="dropdownOpen.set(false)" class="flex items-center gap-[10px] px-[15px] py-[10px] text-[13px] text-[#6b6880] hover:bg-[#F7F7FB] hover:text-[#534AB7] transition-all no-underline cursor-pointer">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
            Messages
          </a>
          <a routerLink="/explore" (click)="dropdownOpen.set(false)" class="flex items-center gap-[10px] px-[15px] py-[10px] text-[13px] text-[#6b6880] hover:bg-[#F7F7FB] hover:text-[#534AB7] transition-all no-underline cursor-pointer">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
            Explore
          </a>
          <div class="h-[1px] bg-[rgba(83,74,183,0.12)] my-[4px]"></div>
          <a routerLink="/settings" (click)="dropdownOpen.set(false)" class="flex items-center gap-[10px] px-[15px] py-[10px] text-[13px] text-[#6b6880] hover:bg-[#F7F7FB] hover:text-[#534AB7] transition-all no-underline cursor-pointer">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
            Settings
          </a>
          <div class="h-[1px] bg-[rgba(83,74,183,0.12)] my-[4px]"></div>
          <a (click)="logout()" class="flex items-center gap-[10px] px-[15px] py-[10px] text-[13px] text-[#c0392b] hover:bg-[#fff5f5] transition-all no-underline cursor-pointer">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
            Sign out
          </a>
        </div>
      }
    </div>
  </div>
</nav>
