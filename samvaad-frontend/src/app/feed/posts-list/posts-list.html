@if (loading() && posts().length === 0) {
  <div class="p-8 text-center text-text-secondary text-[14px]">Loading feed...</div>
} @else if (posts().length === 0) {
  <div class="p-8 text-center text-text-secondary text-[14px]">
    No posts yet. Follow people to see their posts here.
  </div>
} @else {
  @for (post of posts(); track post.id) {
    <app-post-card [post]="post"
                   (postUpdated)="postUpdated.emit($event)"
                   (postDeleted)="postDeleted.emit($event)" />
  }
  @if (hasMore()) {
    <div class="p-4 text-center">
      <button (click)="loadMore.emit()" [disabled]="loading()"
              class="text-[13px] text-accent cursor-pointer hover:underline disabled:opacity-50">
        {{ loading() ? 'Loading...' : 'Load more' }}
      </button>
    </div>
  }
}
